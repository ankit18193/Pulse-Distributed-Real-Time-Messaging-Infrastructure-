version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: pulse-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  pulse-node-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulse-node-1
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - INSTANCE_ID=pulse-node-1
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AUTH_SECRET=pulse-distributed-test-secret-key-32chars
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  pulse-node-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulse-node-2
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - INSTANCE_ID=pulse-node-2
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AUTH_SECRET=pulse-distributed-test-secret-key-32chars
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
